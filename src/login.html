<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Skyzopedia API</title>
<meta name="theme-color" content="#F5EFDD">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
::-webkit-scrollbar { display: none }
body {
    font-family: 'DM Sans', system-ui, sans-serif;
    background-color: #F5EFDD;
    letter-spacing: -0.4px;
    color: #141414;
    min-height: 100vh;
}
body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
        linear-gradient(rgba(0,0,0,.05) 1.5px, transparent 1.5px),
        linear-gradient(90deg, rgba(0,0,0,.05) 1.5px, transparent 1.5px);
    background-size: 40px 40px;
    z-index: -1;
}
.nb-card { background:#fff; border:2px solid #000; box-shadow:5px 5px 0px #000; }
.nb-input {
    border: 2px solid #000; background:#fff; color:#000;
    border-radius: 10px; padding: 12px 14px; width: 100%;
    font-weight: 500; outline: none; transition: box-shadow .15s ease;
}
.nb-input:focus { box-shadow: 3px 3px 0px #000; }
.nb-input.field-error { border-color:#dc2626; }
.nb-btn {
    border: 2px solid #000; box-shadow: 4px 4px 0px #000;
    transition: transform .15s ease, box-shadow .15s ease;
}
.nb-btn:active { transform: translate(3px,3px); box-shadow: 1px 1px 0px #000; }
.nb-btn:disabled { opacity:.5; cursor:not-allowed; }
.shake { animation: shake .35s; }
@keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
}
</style>
</head>
<body class="antialiased flex items-center justify-center px-6 py-14">

<div class="w-full max-w-sm">

    <div class="flex justify-center mb-6">
        <span class="inline-block px-5 py-2 bg-emerald-400 text-black font-bold text-sm rounded-full border-2 border-black" style="box-shadow:3px 3px 0px #000">
            Masuk ke Akun
        </span>
    </div>

    <div class="nb-card rounded-2xl p-7" id="loginCard">
        <h1 class="text-2xl font-extrabold mb-1">Login</h1>
        <p class="text-sm text-gray-700 mb-6">Masukkan username/Gmail dan password kamu.</p>

        <label class="block text-sm font-bold mb-1">Username / Gmail</label>
        <input id="identifierInput" type="text" class="nb-input mb-1" placeholder="username atau nama@gmail.com" autocomplete="username">
        <p id="identifierError" class="text-red-600 text-xs font-semibold mb-3 hidden"></p>

        <label class="block text-sm font-bold mb-1">Password</label>
        <div class="relative mb-1">
            <input id="passwordInput" type="password" class="nb-input pr-11" placeholder="Masukkan password" autocomplete="current-password">
            <button type="button" id="togglePw" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-600">
                <i class="fas fa-eye"></i>
            </button>
        </div>
        <p id="passwordError" class="text-red-600 text-xs font-semibold mb-3 hidden"></p>

        <button id="confirmBtn" class="nb-btn w-full mt-3 py-3 rounded-xl bg-yellow-300 font-bold hover:bg-yellow-200 flex items-center justify-center gap-2">
            <span id="confirmBtnText">Konfirmasi &amp; Masuk</span>
            <i id="confirmSpinner" class="fas fa-circle-notch fa-spin hidden"></i>
        </button>

        <p class="text-center text-sm text-gray-700 mt-5">
            Belum punya akun?
            <a href="/register" class="font-bold text-black underline">Daftar</a>
        </p>
    </div>

    <p id="globalMsg" class="text-center text-sm font-bold mt-5 hidden"></p>
</div>

<script>
const identifierInput = document.getElementById('identifierInput');
const identifierError = document.getElementById('identifierError');
const passwordInput   = document.getElementById('passwordInput');
const passwordError   = document.getElementById('passwordError');
const globalMsg        = document.getElementById('globalMsg');

const urlParams = new URLSearchParams(window.location.search);
const redirectTarget = urlParams.get('redirect') || '/docs';

function shakeEl(el) {
    el.classList.remove('shake');
    void el.offsetWidth;
    el.classList.add('shake');
}

function setError(input, errEl, msg) {
    if (msg) {
        input.classList.add('field-error');
        errEl.textContent = msg;
        errEl.classList.remove('hidden');
        shakeEl(input);
        return false;
    }
    input.classList.remove('field-error');
    errEl.classList.add('hidden');
    return true;
}

// Kalau sudah pernah login (ada token valid), langsung arahkan ke halaman tujuan
(async function checkExistingSession() {
    const token = localStorage.getItem('auth_token');
    if (!token) return;
    try {
        const res = await fetch('/auth/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token })
        });
        const data = await res.json();
        if (data.status) window.location.href = redirectTarget;
    } catch (e) { /* diamkan, biarkan user login manual */ }
})();

document.getElementById('togglePw').addEventListener('click', () => {
    const isPw = passwordInput.type === 'password';
    passwordInput.type = isPw ? 'text' : 'password';
    document.querySelector('#togglePw i').className = isPw ? 'fas fa-eye-slash' : 'fas fa-eye';
});

async function doLogin() {
    globalMsg.classList.add('hidden');

    const identifier = identifierInput.value.trim();
    const password = passwordInput.value;

    let ok = true;
    if (!identifier) ok = setError(identifierInput, identifierError, 'Username atau Gmail wajib diisi') && ok;
    else setError(identifierInput, identifierError, null);

    if (!password) ok = setError(passwordInput, passwordError, 'Password wajib diisi') && ok;
    else setError(passwordInput, passwordError, null);

    if (!ok) return;

    const confirmBtn = document.getElementById('confirmBtn');
    const confirmBtnText = document.getElementById('confirmBtnText');
    const spinner = document.getElementById('confirmSpinner');

    confirmBtn.disabled = true;
    confirmBtnText.textContent = 'Memeriksa...';
    spinner.classList.remove('hidden');

    let res;
    try {
        res = await fetch('/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ identifier, password })
        });
    } catch (err) {
        globalMsg.textContent = 'Tidak bisa menjangkau server. Periksa koneksi internet kamu.';
        globalMsg.className = 'text-center text-sm font-bold mt-5 text-red-600';
        globalMsg.classList.remove('hidden');
        confirmBtn.disabled = false;
        confirmBtnText.textContent = 'Konfirmasi & Masuk';
        spinner.classList.add('hidden');
        return;
    }

    let data;
    try {
        data = await res.json();
    } catch (err) {
        globalMsg.textContent = `Server merespon tidak valid (HTTP ${res.status}). Kemungkinan endpoint /auth/login belum ter-deploy di server ini.`;
        globalMsg.className = 'text-center text-sm font-bold mt-5 text-red-600';
        globalMsg.classList.remove('hidden');
        confirmBtn.disabled = false;
        confirmBtnText.textContent = 'Konfirmasi & Masuk';
        spinner.classList.add('hidden');
        return;
    }

    try {
        if (!data.status) {
            setError(passwordInput, passwordError, data.error || 'Username/email atau password salah');
            passwordInput.value = '';
            passwordInput.focus();
            return;
        }

        localStorage.setItem('auth_token', data.result.token);
        localStorage.setItem('auth_user', JSON.stringify(data.result.user));

        globalMsg.textContent = 'Login berhasil! Mengarahkan...';
        globalMsg.className = 'text-center text-sm font-bold mt-5 text-green-600';
        globalMsg.classList.remove('hidden');

        setTimeout(() => { window.location.href = redirectTarget; }, 700);

    } catch (err) {
        globalMsg.textContent = 'Terjadi kesalahan tak terduga. Coba lagi.';
        globalMsg.className = 'text-center text-sm font-bold mt-5 text-red-600';
        globalMsg.classList.remove('hidden');
    } finally {
        confirmBtn.disabled = false;
        confirmBtnText.textContent = 'Konfirmasi & Masuk';
        spinner.classList.add('hidden');
    }
}

document.getElementById('confirmBtn').addEventListener('click', doLogin);
[identifierInput, passwordInput].forEach(el => {
    el.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
});
</script>

</body>
</html>
